# Kubernetes deployment alternative
apiVersion: v1
kind: Namespace
metadata:
  name: gamefi-monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamefi-monitor
  namespace: gamefi-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gamefi-monitor
  template:
    metadata:
      labels:
        app: gamefi-monitor
    spec:
      containers:
      - name: gamefi-monitor
        image: gamefi/monitor:latest
        env:
        - name: NODE_ENV
          value: "production"
        - name: RPC_URL
          valueFrom:
            secretKeyRef:
              name: gamefi-secrets
              key: rpc-url
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: gamefi-secrets
              key: mongodb-uri
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gamefi-monitor-service
  namespace: gamefi-monitoring
spec:
  selector:
    app: gamefi-monitor
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gamefi-monitor
  namespace: gamefi-monitoring
spec:
  selector:
    matchLabels:
      app: gamefi-monitor
  endpoints:
  - port: metrics
    interval: 30s
---
# HorizontalPodAutoscaler for scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gamefi-monitor-hpa
  namespace: gamefi-monitoring
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gamefi-monitor
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80