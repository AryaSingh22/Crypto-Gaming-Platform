# Monitoring Infrastructure Deployment Configuration

version: '3.8'

services:
  # GameFi Monitoring Service
  gamefi-monitor:
    build:
      context: .
      dockerfile: monitoring/Dockerfile
    environment:
      - NODE_ENV=production
      - RPC_URL=${RPC_URL}
      - WS_RPC_URL=${WS_RPC_URL}
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=${REDIS_URL}
      - SLACK_WEBHOOK=${SLACK_WEBHOOK}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - EMAIL_SERVICE_API_KEY=${EMAIL_SERVICE_API_KEY}
    volumes:
      - ./monitoring/config:/app/config:ro
      - ./monitoring/logs:/app/logs
    networks:
      - gamefi-network
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
      - prometheus

  # MongoDB for storing monitoring data
  mongodb:
    image: mongo:6.0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=gamefi_monitoring
    volumes:
      - mongodb_data:/data/db
      - ./monitoring/mongodb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - gamefi-network
    restart: unless-stopped

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - gamefi-network
    restart: unless-stopped

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - gamefi-network
    restart: unless-stopped

  # Grafana for monitoring dashboards
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - gamefi-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # AlertManager for alert routing
  alertmanager:
    image: prom/alertmanager:latest
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - gamefi-network
    restart: unless-stopped

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'
    pid: host
    networks:
      - gamefi-network
    restart: unless-stopped

  # ELK Stack for log management
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - gamefi-network
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.8.0
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./monitoring/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: "-Xmx512m -Xms512m"
    networks:
      - gamefi-network
    depends_on:
      - elasticsearch
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - gamefi-network
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Security scanning service
  security-scanner:
    build:
      context: .
      dockerfile: monitoring/security/Dockerfile
    environment:
      - NODE_ENV=production
      - SCAN_INTERVAL=300 # 5 minutes
      - CONTRACT_ADDRESSES=${CONTRACT_ADDRESSES}
      - RPC_URL=${RPC_URL}
    volumes:
      - ./monitoring/security/config:/app/config:ro
      - ./monitoring/security/reports:/app/reports
    networks:
      - gamefi-network
    restart: unless-stopped
    depends_on:
      - mongodb

  # Backup service
  backup-service:
    image: alpine:latest
    command: /app/backup.sh
    environment:
      - BACKUP_INTERVAL=21600 # 6 hours
      - S3_BUCKET=${BACKUP_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./monitoring/backup/backup.sh:/app/backup.sh:ro
      - mongodb_data:/data/mongodb:ro
      - prometheus_data:/data/prometheus:ro
      - grafana_data:/data/grafana:ro
      - ./monitoring/logs:/data/logs:ro
    networks:
      - gamefi-network
    restart: unless-stopped

networks:
  gamefi-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  elasticsearch_data:
